<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="부자형이 직접 살펴본 경매 물건의 핵심 요약과 입찰 전 확인할 점.">
  <meta name="theme-color" content="#171815">
  <title>부자형 경매물건요약 | 경매하는 부자형</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#171815;--paper:#f1eee6;--red:#8f2e25;--gold:#a88747;--line:#d4ccbc;--muted:#777168}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans KR',sans-serif;word-break:keep-all}
    .header{height:76px;padding:0 6vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:rgba(241,238,230,.95);position:sticky;top:0;z-index:10}
    .brand{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none;font:700 16px 'Gowun Batang',serif}
    .brand span{width:34px;height:34px;display:grid;place-items:center;background:var(--red);color:#fff;font-size:20px}
    .header>a:last-child{color:var(--muted);font-size:12px;text-decoration:none}
    .hero{padding:76px 7vw 66px;background:var(--ink);color:var(--paper)}
    .eyebrow{margin:0 0 18px;color:#c7a765;font-size:10px;letter-spacing:.23em}
    .hero h1{margin:0 0 20px;font:400 clamp(34px,5.4vw,64px)/1.2 'Gowun Batang';letter-spacing:-.055em}
    .hero .address{max-width:760px;margin:0;color:#bbb5aa;font:15px/1.9 'Gowun Batang'}
    .hero .tags{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 0}
    .hero .tags span{border:1px solid #4a4841;color:#cfc8bc;font-size:11px;padding:6px 12px}
    .facts{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#4a4841;margin-top:45px;max-width:980px}
    .facts div{background:var(--ink);padding:22px}
    .facts small{display:block;color:#918b81;font-size:10px;margin-bottom:8px}
    .facts strong{font:700 18px 'Gowun Batang';color:#f1eee6}
    .body{max-width:1180px;margin:0 auto;padding:74px 28px 110px}
    .summary{display:grid;grid-template-columns:1fr .72fr;gap:48px;padding-bottom:60px;border-bottom:1px solid var(--line)}
    .summary h2,.gallery h2{font:400 clamp(28px,3.6vw,44px) 'Gowun Batang';letter-spacing:-.05em;margin:0 0 25px}
    .summary p{font:15px/2 'Gowun Batang';margin:0 0 18px}
    .summary p:last-child{margin-bottom:0}
    .notice{align-self:start;background:#e2dacb;border-left:3px solid var(--red);padding:25px}
    .notice strong{display:block;color:var(--red);font:700 17px 'Gowun Batang';margin-bottom:10px}
    .notice p{font:12px/1.8 'Noto Sans KR';margin:0}
    .gallery{padding-top:66px}
    .gallery-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}
    .gallery-head p{color:var(--muted);font-size:11px;margin:0}
    .gallery figure{margin:0 0 26px;background:#e7e1d6;border:1px solid var(--line);padding:14px}
    .gallery img{display:block;width:100%;height:auto;max-height:820px;object-fit:contain;background:#fff}
    .gallery figcaption{padding:13px 3px 2px;color:var(--muted);font-size:11px}
    .cta{margin-top:64px;padding:38px 34px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:space-between;gap:26px;flex-wrap:wrap}
    .cta h3{margin:0 0 8px;font:400 26px 'Gowun Batang';letter-spacing:-.04em}
    .cta p{margin:0;color:#a9a399;font-size:13px}
    .cta a{color:#fff;background:var(--red);text-decoration:none;font-size:13px;padding:15px 24px;white-space:nowrap}
    .back{display:inline-block;margin-top:34px;color:var(--red);text-decoration:none;font-size:13px;font-weight:700;border-bottom:1px solid var(--red);padding-bottom:5px}
    .links{display:flex;gap:26px;flex-wrap:wrap;align-items:center}
    .state{max-width:900px;margin:0 auto;padding:110px 28px;text-align:center}
    .state h2{font:400 30px 'Gowun Batang';margin:0 0 14px}
    .state p{color:var(--muted);font-size:14px;margin:0 0 26px}
    footer{padding:34px 7vw;border-top:1px solid var(--line);color:var(--muted);font-size:10px}
    @media(max-width:760px){
      .header{height:66px;padding:0 20px}
      .hero{padding:58px 22px}
      .facts{grid-template-columns:1fr 1fr}
      .body{padding:55px 20px 80px}
      .summary{grid-template-columns:1fr;gap:30px}
      .gallery-head{display:block}
      .gallery figure{padding:8px}
      .cta{padding:30px 22px}
    }
  </style>
</head>
<body>
  <header class="header">
    <a class="brand" href="index.html"><span>富</span>경매하는 부자형</a>
    <a href="auction-picks.html">추천 물건 목록</a>
  </header>
  <main id="pick-detail">
    <div class="state"><h2>물건 요약을 불러오고 있습니다.</h2><p>잠시만 기다려 주세요.</p></div>
  </main>
  <footer><span>경매하는 부자형 · 유영수</span> &nbsp; ※ 본 내용은 투자 참고용이며 수익을 보장하지 않습니다. 입찰 전 법원 서류와 현황을 직접 다시 확인하세요.</footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="auction-pick.js"></script>
</body>
</html>
