<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#171815">
  <title>스레드 서당 관리 | 경매하는 부자형</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="portal.css">
</head>
<body>
  <div class="portal-grain" aria-hidden="true"></div>
  <header class="portal-header">
    <a class="portal-brand" href="index.html"><span class="portal-mark">富</span><span>스레드 서당 관리</span></a>
    <nav class="portal-nav"><a href="seodang.html">공개 페이지 보기</a><button id="logout-button" class="link-button" type="button" hidden>로그아웃</button></nav>
  </header>

  <main class="admin-shell">
    <section id="login-panel" class="login-panel">
      <p class="portal-eyebrow">OWNER ONLY</p>
      <h1>관리자 로그인</h1>
      <p class="notice">이 화면은 경매하는 부자형 관리자만 사용할 수 있습니다.</p>
      <div id="login-message" aria-live="polite"></div>
      <form id="login-form">
        <div class="form-field"><label for="admin-pin">관리 비밀번호</label><input id="admin-pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="current-password" placeholder="숫자 4자리" required></div>
        <div class="button-row"><button class="primary-button" type="submit">관리 화면 열기</button></div>
      </form>
    </section>

    <section id="admin-app" class="admin-app">
      <div class="admin-head">
        <div><p class="portal-eyebrow">THREAD SEODANG CMS</p><h1 class="admin-title">스레드 서당 글 관리</h1><p>원고를 골라 게시하고, 공개된 글을 수정하거나 삭제할 수 있습니다.</p></div>
        <a class="secondary-button" href="seodang.html" target="_blank" rel="noopener">공개 화면 확인 ↗</a>
      </div>
      <div id="admin-message" aria-live="polite"></div>
      <div class="admin-tabs" role="tablist">
        <button class="admin-tab active" type="button" data-view="sources">원고에서 선택</button>
        <button class="admin-tab" type="button" data-view="published">게시 글 관리</button>
      </div>

      <section id="view-sources" class="admin-view active">
        <div class="source-toolbar">
          <label class="search-box"><span class="sr-only">원고 검색</span><input id="source-search" type="search" placeholder="번호·성어·문장 검색"></label>
          <button id="clear-selection" class="secondary-button" type="button">선택 해제</button>
        </div>
        <div id="source-list" class="source-list"><div class="loading">HWPX 원고를 불러오고 있습니다.</div></div>
        <div class="selection-bar"><p><strong id="selection-count">0</strong>편 선택됨</p><button id="publish-selected" class="primary-button" type="button" disabled>선택한 글 게시</button></div>
      </section>

      <section id="view-published" class="admin-view">
        <div id="published-list" class="published-list"><div class="loading">게시 글을 불러오고 있습니다.</div></div>
      </section>
    </section>
  </main>

  <div id="edit-modal" class="modal edit-dialog" role="dialog" aria-modal="true" aria-labelledby="edit-heading">
    <form id="edit-form" class="modal-panel">
      <button class="modal-close" type="button" aria-label="닫기">×</button>
      <p class="portal-eyebrow">EDIT POST</p>
      <h2 id="edit-heading" class="admin-title">글 수정</h2>
      <input id="edit-id" type="hidden">
      <div class="form-field"><label for="edit-title">제목</label><input id="edit-title" type="text" required></div>
      <div class="form-field"><label for="edit-body">본문</label><textarea id="edit-body" required></textarea></div>
      <div class="button-row"><button class="primary-button" type="submit">수정 내용 저장</button><button id="edit-cancel" class="secondary-button" type="button">취소</button></div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
