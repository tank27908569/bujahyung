<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#171815">
  <title>글 관리 | 경매하는 부자형</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="portal.css">
</head>
<body>
  <div class="portal-grain" aria-hidden="true"></div>
  <header class="portal-header">
    <a class="portal-brand" href="index.html"><span class="portal-mark">富</span><span>부자형 글 관리</span></a>
    <nav class="portal-nav"><a href="index.html#contents">공개 페이지 보기</a><button id="logout-button" class="link-button" type="button" hidden>관리 화면 닫기</button></nav>
  </header>

  <main class="admin-shell">
    <section id="login-panel" class="login-panel">
      <p class="portal-eyebrow">OWNER ONLY</p>
      <h1>관리 비밀번호 입력</h1>
      <p class="notice">아이디나 계정 로그인 없이 관리 비밀번호만 입력하면 글을 관리할 수 있습니다.</p>
      <div id="login-message" aria-live="polite"></div>
      <form id="login-form">
        <div class="form-field"><label for="admin-pin">관리 비밀번호</label><input id="admin-pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="current-password" placeholder="숫자 4자리" required></div>
        <div class="button-row"><button class="primary-button" type="submit">비밀번호 확인</button></div>
      </form>
    </section>

    <section id="admin-app" class="admin-app">
      <div class="admin-head">
        <div><p class="portal-eyebrow">BUJAHYUNG CONTENT CMS</p><h1 class="admin-title">부자형 통합 관리</h1><p>게시 글과 사업 상담 신청을 한 화면에서 관리할 수 있습니다.</p></div>
        <a class="secondary-button" href="index.html#contents" target="_blank" rel="noopener">공개 화면 확인 ↗</a>
      </div>
      <div id="admin-message" aria-live="polite"></div>
      <div class="admin-tabs" role="tablist">
        <button class="admin-tab active" type="button" data-view="create">새 글 작성</button>
        <button class="admin-tab" type="button" data-view="sources">스레드 원고 선택</button>
        <button class="admin-tab" type="button" data-view="published">전체 글 관리</button>
        <button class="admin-tab" type="button" data-view="inquiries">상담 신청 관리 <span id="new-inquiry-count" class="tab-count" hidden></span></button>
      </div>

      <section id="view-create" class="admin-view active">
        <form id="create-form" class="editor-form">
          <div class="form-field"><label for="create-category">글 분류</label><select id="create-category" required></select></div>
          <div class="form-field"><label for="create-title">제목</label><input id="create-title" type="text" maxlength="300" required></div>
          <div class="form-field"><label for="create-body">본문</label><textarea id="create-body" maxlength="30000" placeholder="글 내용을 입력하세요." required></textarea></div>
          <label class="check-field"><input id="create-published" type="checkbox" checked><span>작성과 동시에 공개</span></label>
          <div class="button-row"><button class="primary-button" type="submit">새 글 저장</button><button id="create-reset" class="secondary-button" type="reset">입력 지우기</button></div>
        </form>
      </section>

      <section id="view-sources" class="admin-view">
        <div class="source-toolbar">
          <label class="search-box"><span class="sr-only">원고 검색</span><input id="source-search" type="search" placeholder="번호·성어·문장 검색"></label>
          <button id="clear-selection" class="secondary-button" type="button">선택 해제</button>
        </div>
        <div id="source-list" class="source-list"><div class="loading">HWPX 원고를 불러오고 있습니다.</div></div>
        <div class="selection-bar"><p><strong id="selection-count">0</strong>편 선택됨</p><button id="publish-selected" class="primary-button" type="button" disabled>선택한 글 게시</button></div>
      </section>

      <section id="view-published" class="admin-view">
        <div class="source-toolbar">
          <label class="form-field inline-field"><span class="sr-only">분류 선택</span><select id="post-category-filter"></select></label>
          <label class="search-box"><span class="sr-only">게시 글 검색</span><input id="published-search" type="search" placeholder="제목 또는 본문 검색"></label>
        </div>
        <div id="published-list" class="published-list"><div class="loading">게시 글을 불러오고 있습니다.</div></div>
      </section>

      <section id="view-inquiries" class="admin-view">
        <div class="source-toolbar">
          <div><h2 class="view-title">사업 상담 신청</h2><p class="view-description">신청자에게 연락한 뒤 처리 상태를 변경하세요.</p></div>
          <label class="form-field inline-field"><span class="sr-only">상담 상태 선택</span><select id="inquiry-status-filter"><option value="all">전체 상태</option><option value="new">새 신청</option><option value="contacted">연락 완료</option><option value="completed">상담 완료</option><option value="archived">보관</option></select></label>
        </div>
        <div id="inquiry-list" class="inquiry-list"><div class="loading">상담 신청을 불러오고 있습니다.</div></div>
      </section>
    </section>
  </main>

  <div id="edit-modal" class="modal edit-dialog" role="dialog" aria-modal="true" aria-labelledby="edit-heading">
    <form id="edit-form" class="modal-panel">
      <button class="modal-close" type="button" aria-label="닫기">×</button>
      <p class="portal-eyebrow">EDIT POST</p>
      <h2 id="edit-heading" class="admin-title">글 수정</h2>
      <input id="edit-id" type="hidden">
      <div class="form-field"><label for="edit-category">글 분류</label><select id="edit-category" required></select></div>
      <div class="form-field"><label for="edit-title">제목</label><input id="edit-title" type="text" required></div>
      <div class="form-field"><label for="edit-body">본문</label><textarea id="edit-body" required></textarea></div>
      <div class="button-row"><button class="primary-button" type="submit">수정 내용 저장</button><button id="edit-cancel" class="secondary-button" type="button">취소</button></div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
